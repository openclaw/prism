name: Windows codec fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fallback:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6.0.10
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install ImageMagick codecs
        run: |
          choco install imagemagick --yes --no-progress
          $magick = Get-ChildItem 'C:\Program Files\ImageMagick-*\magick.exe' | Select-Object -First 1
          if (!$magick) { throw 'ImageMagick executable not found' }
          $magick.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: node scripts/windows-fallback-smoke.mjs
